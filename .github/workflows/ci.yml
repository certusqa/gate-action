name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test
      - name: Refuse an empty suite
        run: |
          set -euo pipefail
          n=$(find test -name '*.test.js' | wc -l | tr -d ' ')
          [ "$n" -ge 1 ] || { echo "::error::no test files found"; exit 1; }

  # The action run on its own fixtures, one job per verdict. Each job asserts
  # the outputs, and the enforce job proves the red path really goes red.
  self-test:
    name: Self-test (${{ matrix.case.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - { name: block, fixture: results-mixed.json, verdict: BLOCK_DEPLOY, failed: "1", flaky: "1" }
          - { name: clear, fixture: results-all-pass.json, verdict: CLEAR_TO_DEPLOY, failed: "0", flaky: "0" }
          - { name: review, fixture: results-flaky.json, verdict: REVIEW_ARTIFACTS, failed: "0", flaky: "1" }
          - { name: corrupt, fixture: results-corrupt.json, verdict: INSUFFICIENT_EVIDENCE, failed: "", flaky: "" }
          - { name: absent, fixture: "", verdict: INSUFFICIENT_EVIDENCE, failed: "", flaky: "" }
    steps:
      - uses: actions/checkout@v5
      - name: Stage fixture as a Playwright report
        run: |
          mkdir -p work/test-results
          if [ -n "${{ matrix.case.fixture }}" ]; then cp "test/fixtures/${{ matrix.case.fixture }}" work/test-results/results.json; fi
      - name: Run the action (report-only)
        id: gate
        uses: ./
        with:
          working-directory: work
          artifact-name: gate-${{ matrix.case.name }}
      - name: Assert outputs
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
          FAILED: ${{ steps.gate.outputs.failed }}
          FLAKY: ${{ steps.gate.outputs.flaky }}
        run: |
          set -euo pipefail
          [ "$VERDICT" = "${{ matrix.case.verdict }}" ] || { echo "::error::verdict $VERDICT, wanted ${{ matrix.case.verdict }}"; exit 1; }
          [ "$FAILED" = "${{ matrix.case.failed }}" ] || { echo "::error::failed=$FAILED, wanted ${{ matrix.case.failed }}"; exit 1; }
          [ "$FLAKY" = "${{ matrix.case.flaky }}" ] || { echo "::error::flaky=$FLAKY, wanted ${{ matrix.case.flaky }}"; exit 1; }
          test -f work/certusqa-gate/gate.json
          test -f work/certusqa-gate/summary.md
          echo "ok: $VERDICT"

  enforce-goes-red:
    name: Self-test (enforce blocks a failing run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p work/test-results && cp test/fixtures/results-mixed.json work/test-results/results.json
      - name: Run the action in enforce mode (expected to fail)
        id: gate
        continue-on-error: true
        uses: ./
        with:
          working-directory: work
          mode: enforce
          artifact-name: ""
      - name: The job must have gone red, with the evidence already written
        run: |
          set -euo pipefail
          [ "${{ steps.gate.outcome }}" = "failure" ] || { echo "::error::enforce mode did not fail on BLOCK_DEPLOY"; exit 1; }
          test -f work/certusqa-gate/gate.json
          grep -q '"verdict": "BLOCK_DEPLOY"' work/certusqa-gate/gate.json
          echo "ok: enforce failed the step and gate.json exists"

  # This is a public repository and a thin client. Nothing from the private
  # engine may land here: no engine paths, no imports of it, no tokens.
  boundary:
    name: Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          if grep -rnE 'qa/ai/c[o]re|qa-forge-c[o]re|SmartLocat[o]rEngine|RunArtifactJ[u]dge' --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::engine reference in a public action"; exit 1; fi
          if grep -rnE 'ghp_[A-Za-z0-9]{20,}|github_pat_|sk_live_|whsec_|BEGIN (RSA |EC )?PRIVATE KEY' --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::secret-shaped string"; exit 1; fi
          if grep -rn 'require(' gate.js enforce.js upload.js | grep -vE "require\('(crypto|fs|path|os)'\)|require\('\./upload\.js'\)|require\.main"; then
            echo "::error::gate.js, enforce.js and upload.js must stay dependency-free"; exit 1; fi
          echo "clean"

  # The upload path against a stub that verifies the bearer and both signature
  # headers with an independent node:crypto derivation, then answers like the
  # real endpoint. Proves: the key never appears in logs, the request is signed
  # correctly, outputs carry the run id, and a refusal is a warning not a failure.
  upload-self-test:
    name: Self-test (api-key upload)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STUB_SECRET: cqa_live_selftestselftestselftestselftestselft
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start stub platform
        run: |
          node tools/stub-platform.js 8099 "$STUB_SECRET" 2> stub.log &
          for i in $(seq 1 20); do grep -q listening stub.log && break; sleep 0.5; done
          cat stub.log
      - run: mkdir -p work/test-results && cp test/fixtures/results-mixed.json work/test-results/results.json
      - name: Run the action with an api-key
        id: gate
        uses: ./
        with:
          working-directory: work
          artifact-name: ""
          api-key: ${{ env.STUB_SECRET }}
          api-url: http://127.0.0.1:8099/api/v1/runs
      - name: Assert upload happened, outputs set, key never printed
        env:
          RUN_ID: ${{ steps.gate.outputs.run-id }}
          RUN_URL: ${{ steps.gate.outputs.run-url }}
        run: |
          set -euo pipefail
          cat stub.log
          grep -q 'accepted BLOCK_DEPLOY' stub.log
          [ "$RUN_ID" = "run_stub0001" ] || { echo "::error::run-id=$RUN_ID"; exit 1; }
          [ -n "$RUN_URL" ]
          if grep -rq "$STUB_SECRET" work/certusqa-gate/; then echo "::error::secret written to evidence"; exit 1; fi
          echo "ok: uploaded as $RUN_ID"
      - name: A refused upload is a warning, not a failure
        id: refused
        uses: ./
        with:
          working-directory: work
          artifact-name: ""
          api-key: cqa_live_wrongkeywrongkeywrongkeywrongkeywrong
          api-url: http://127.0.0.1:8099/api/v1/runs
      - run: |
          [ "${{ steps.refused.outcome }}" = "success" ] || { echo "::error::a refused upload failed the step"; exit 1; }
          [ -z "${{ steps.refused.outputs.run-id }}" ] || { echo "::error::run-id set on a refused upload"; exit 1; }
          echo "ok: refusal was a warning"

  # Dogfood: upload the mixed-fixture run to the real CertusQA platform when
  # the repository has a CERTUSQA_API_KEY secret. Skips cleanly when it does
  # not (forks, or before the key exists). The verdict is report-only and the
  # job never fails on an upload problem — that is the action's own contract.
  dogfood-upload:
    name: Dogfood (upload to app.certusqa.com)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - name: Is a platform key configured?
        id: key
        env:
          KEY: ${{ secrets.CERTUSQA_API_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Stage the fixture as a Playwright report
        if: steps.key.outputs.present == 'true'
        run: mkdir -p work/test-results && cp test/fixtures/results-mixed.json work/test-results/results.json
      - name: Run the action with the platform key
        if: steps.key.outputs.present == 'true'
        id: gate
        uses: ./
        with:
          working-directory: work
          artifact-name: dogfood-gate
          api-key: ${{ secrets.CERTUSQA_API_KEY }}
      - name: Report
        if: steps.key.outputs.present == 'true'
        run: |
          echo "verdict=${{ steps.gate.outputs.verdict }} run-id=${{ steps.gate.outputs.run-id }}"
          echo "${{ steps.gate.outputs.run-url }}"
      - name: No key — skipped
        if: steps.key.outputs.present != 'true'
        run: echo "CERTUSQA_API_KEY is not set on this repository; nothing uploaded."
